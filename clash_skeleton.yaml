proxy-providers:
  airport:
    type: http
    url: <url>
    path: ./proxy_providers/airport.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://8.8.8.8/generate_204
      interval: 300
      lazy: false

proxies:
  - name: chain.mid.proxy
    type: socks5
    server: <server_ip>
    port: <port>
    username: <username>
    password: <password>
    udp: true
    dialer-proxy: MID

  - name: ENDPOINT.MID.443
    type: vless
    server: "10.10.0.1"
    port: 443
    uuid: "<uuid>"
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: www.apple.com
    client-fingerprint: chrome
    reality-opts:
      public-key: "<public_key>"
      short-id: "<short_id>"
    packet-encoding: xudp

  - name: ENDPOINT.MID.2053
    type: vless
    server: "10.10.0.1"
    port: 2053
    uuid: "<uuid>"
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: www.apple.com
    client-fingerprint: chrome
    reality-opts:
      public-key: "<public_key>"
      short-id: "<short_id>"
    packet-encoding: xudp
    
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - chain.mid.proxy
      - MID

  - name: MID
    type: fallback
    proxies:
      - ENDPOINT.MID.443
      - ENDPOINT.MID.2053
    url: https://8.8.8.8/generate_204
    interval: 300
    lazy: false

# ==================== 基础运行设置 ====================
# 按规则决定直连或代理。
mode: rule
# 禁止局域网设备使用本机代理。
allow-lan: false
# 保留常用运行日志。
log-level: info
# 关闭内核 IPv6；DNS 的 AAAA 响应在下方单独关闭。
ipv6: false

# ==================== 进程匹配 ====================
# 应用程序规则可能依赖进程识别。
find-process-mode: always

# ==================== 远程规则集 ====================
