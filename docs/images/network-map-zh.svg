<svg xmlns="http://www.w3.org/2000/svg" width="640" height="972" viewBox="0 0 640 972" role="img" aria-labelledby="title desc">
  <title id="title">星形拓扑：VPS 是中心</title>
  <desc id="desc">星形拓扑：每台 AWG 设备单独连接中心 VPS，内网互访按设备 A、VPS、设备 B 转发，不做节点间 P2P 直连。VLESS 客户端经 VPS 单向发起对授权内网目标的访问，默认无内网权限。AWG 首次握手确认后默认全内网互通；权限按目标、TCP 或 UDP、端口范围控制，可批量添加。基础 AWG 无需机场或额外出口。</desc>
  <defs>
    <style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:26px;fill:#193e3b}.title{font-size:32px;font-weight:700}.heading{font-weight:700}.small{font-size:23px}.muted{fill:#526963}.node{fill:#fff;stroke:#cbd9ce;stroke-width:2}.hub{fill:#197759;stroke:#125c43;stroke-width:2}.on-hub{fill:#fff}.line{fill:none;stroke:#197759;stroke-width:3;stroke-linecap:round}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#197759" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="972" rx="20" fill="#f5f4ee"/>
  <text class="title" x="24" y="49">星形拓扑：VPS 是中心</text>
  <rect x="24" y="82" width="592" height="450" rx="16" fill="#e7f4eb"/>
  <text class="heading" x="44" y="121">AWG</text>
  <text x="132" y="121">双向内网互联</text>
  <rect class="node" x="244" y="148" width="152" height="60" rx="10"/>
  <text text-anchor="middle" x="320" y="187">电脑 A</text>
  <rect class="node" x="44" y="274" width="148" height="84" rx="10"/>
  <text text-anchor="middle" x="118" y="325">NAS</text>
  <rect class="node" x="448" y="274" width="148" height="84" rx="10"/>
  <text text-anchor="middle" x="522" y="325">服务器</text>
  <rect class="node" x="244" y="414" width="152" height="60" rx="10"/>
  <text text-anchor="middle" x="320" y="453">电脑 B</text>
  <path class="line" d="M320 214 V268" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M198 316 H244" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M396 316 H442" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M320 364 V408" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect class="hub" x="250" y="274" width="140" height="84" rx="14"/>
  <text class="heading on-hub" text-anchor="middle" x="320" y="310">VPS</text>
  <text class="small on-hub" text-anchor="middle" x="320" y="341">中心转发</text>
  <text class="small" text-anchor="middle" x="320" y="509">节点互访经 VPS 转发 · 无 P2P 直连</text>
  <rect x="24" y="548" width="592" height="200" rx="16" fill="#fff" stroke="#dbe3da" stroke-width="2"/>
  <text class="heading" x="44" y="587">VLESS</text>
  <text x="150" y="587">单向发起访问</text>
  <rect class="node" x="44" y="614" width="174" height="74" rx="10"/>
  <text text-anchor="middle" x="131" y="660">手机</text>
  <path class="line" d="M229 651 H266" marker-end="url(#arrow)"/>
  <rect class="node" x="278" y="614" width="92" height="74" rx="10"/>
  <text text-anchor="middle" x="324" y="660">VPS</text>
  <path class="line" d="M382 651 H418" marker-end="url(#arrow)"/>
  <rect class="node" x="430" y="614" width="166" height="74" rx="10"/>
  <text text-anchor="middle" x="513" y="660">授权目标</text>
  <circle cx="51" cy="721" r="5" fill="#a65a14"/>
  <text x="68" y="730">默认无内网权限</text>
  <text x="44" y="789">AWG：首次握手确认后</text>
  <text class="small muted" x="44" y="824">默认全内网互通；可按需收紧权限</text>
  <text class="heading" x="44" y="868">按目标 · TCP / UDP · 端口范围授权</text>
  <text class="muted" x="44" y="906">多条规则一起添加</text>
  <path d="M44 927 H596" stroke="#dbe3da" stroke-width="2"/>
  <text class="small" x="44" y="957">基础 AWG：无需机场 / 额外出口</text>
</svg>
