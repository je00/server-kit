{% if request.user.is_superuser %}<div class="qr-modal sensitive-auth-modal" data-sensitive-auth-modal hidden><button class="qr-backdrop" type="button" data-sensitive-auth-close aria-label="取消验证"></button><section class="qr-dialog" role="dialog" aria-modal="true" aria-labelledby="shared-sensitive-auth-title"><button class="qr-close" type="button" data-sensitive-auth-close aria-label="关闭">×</button><p class="eyebrow">敏感操作确认</p><h2 id="shared-sensitive-auth-title">验证身份后继续</h2><p class="muted" data-sensitive-auth-context>验证后继续当前操作，不会刷新页面或丢失编辑内容。</p><form class="stack-form sensitive-auth-form" method="post" action="{% url 'sensitive-unlock' %}" data-sensitive-auth-form>{% csrf_token %}<input type="hidden" name="destination" value="{{ sensitive_auth_destination }}"><label>当前账号密码<input type="password" name="password" required autocomplete="current-password" data-sensitive-auth-password></label><p class="form-error" data-sensitive-auth-error hidden></p><button class="action-button" type="submit">验证并继续</button></form></section></div>{% endif %}
