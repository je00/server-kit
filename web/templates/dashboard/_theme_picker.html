<div class="theme-picker {{ theme_picker_class }}" data-theme-picker>
  <span class="theme-picker-label">外观主题</span>
  <div class="theme-options" role="group" aria-label="外观主题">
    <button type="button" class="theme-option" data-theme-value="dark" aria-pressed="false"><i class="theme-swatch dark-swatch" aria-hidden="true"></i>深色</button>
    <button type="button" class="theme-option" data-theme-value="light" aria-pressed="false"><i class="theme-swatch light-swatch" aria-hidden="true"></i>亮色</button>
    <button type="button" class="theme-option" data-theme-value="sky" aria-pressed="false"><i class="theme-swatch sky-swatch" aria-hidden="true"></i>天蓝</button>
  </div>
</div>
